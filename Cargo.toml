[package]
name = "cloudstack-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Async Apache CloudStack API client driven by runtime API discovery (listApis)"
license = "Apache-2.0"
repository = "https://github.com/DaanHoogland/cloudstack-rs"
readme = "README.md"
keywords = ["cloudstack", "cloud", "iaas", "api", "client"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "rustls-tls", "http2", "charset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"
